[package]
name = "prism2"
version = "1.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/prism.git"
description = "A GUI abstraction library for building UI kits"
documentation = "https://docs.rs/prism2"

exclude = ["**/.DS_Store", ".idea/**"]

[dependencies]
anyanymap = "1.0.2"
downcast-rs = "2.0.2"
uuid = { version = "1.16.0", features = ["v4", "js"] }
prism_proc = "1.0.0"
image = "0.24.9"
include_dir = "0.7.4"
nsvg = "0.5.1"
dyn-clone = "1.0.20"
inventory = "0.3"


fontdue = "0.9.4"
swash = "0.2.10"
lazy_static = "1.5.1"
unicode-segmentation = "1.13.3"

air = "3.0.0"
