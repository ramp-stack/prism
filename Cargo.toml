[package]
name = "prism2"
version = "2.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/prism.git"
description = "A GUI abstraction library for building UI kits"
documentation = "https://docs.rs/prism2"

exclude = ["**/.DS_Store", ".idea/**"]

[dependencies]
anyanymap = "1.0.2"
downcast-rs = "2.0.2"
uuid = { version = "1.16.0", features = ["v4", "js"] }
prism_proc = {version = "2.0.0", path = "prism_proc"}
include_dir = "0.7.4"
nsvg = "0.5.1"
dyn-clone = "1.0.20"
inventory = "0.3"
futures-timer = "3.0.4"
futures = "0.3.34"
fastrand = "2"


fontdue = "0.9.4"
swash = "0.2.10"
unicode-segmentation = "1.13.3"

air = "3.0.1"

serde = {version = "1", features = ["derive"]}

erased-serde = "0.4"
